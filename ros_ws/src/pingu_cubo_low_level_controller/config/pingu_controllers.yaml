controller_manager:
  ros__parameters:
    update_rate: 200 # Hz Caped to 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    # All actuator controllers
    ## Control all actuators using one controller
    actuators_position_controller:
      type: forward_command_controller/ForwardCommandController

    actuators_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    actuators_effort_controller:
      type: forward_command_controller/ForwardCommandController

    actuators_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # RW controllers declaration
    rw_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    rw_effort_controller:
      type: forward_command_controller/ForwardCommandController

    # Arm controllers declaration
    ## Dual arm controllers
    dual_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dual_arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    dual_arm_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    dual_arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

    ## Left arm
    left_arm_position_controller:
      type: forward_command_controller/ForwardCommandController
      
    left_arm_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    left_arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

    left_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_shoulder_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_elbow_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_shoulder_effort_controller:
      type: forward_command_controller/ForwardCommandController
    
    left_arm_elbow_effort_controller:
      type: forward_command_controller/ForwardCommandController

    ## Right arm
    right_arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    right_arm_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    right_arm_effort_controller:
      type: forward_command_controller/ForwardCommandController

    right_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_shoulder_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_elbow_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_shoulder_effort_controller:
      type: forward_command_controller/ForwardCommandController

    right_arm_elbow_effort_controller:
      type: forward_command_controller/ForwardCommandController

#-------------------------------------------------------------
# Controllers configuration
#-------------------------------------------------------------

# Actuators controllers configuration
actuators_position_controller:
  ros__parameters:
    joints:
      - rw_joint
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint
    interface_name: position

actuators_velocity_controller:
  ros__parameters:
    joints:
      - rw_joint
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint
    interface_name: velocity

actuators_effort_controller:
  ros__parameters:
    joints:
      - rw_joint
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint
    interface_name: effort

actuators_trajectory_controller:
  ros__parameters:
    joints:
      - rw_joint
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0 # Defaults to 20

    allow_partial_joints_goal: false # Defaults to false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)

    gains:
      rw_joint:
        p: 5.0
        i: 0.0
        d: 1.0

      left_shoulder_joint:
        p: 5.0
        i: 0.0
        d: 1.0

      left_elbow_joint:
        p: 5.0
        i: 0.0
        d: 1.0

      right_shoulder_joint:
        p: 5.0
        i: 0.0
        d: 1.0

      right_elbow_joint:
        p: 5.0
        i: 0.0
        d: 1.0

# RW controllers configuration
rw_velocity_controller:
  ros__parameters:
    joints:
      - rw_joint
    interface_name: velocity

rw_effort_controller:
  ros__parameters:
    joints:
      - rw_joint
    interface_name: effort

# Arm controllers configuration
## Dual arm controllers
dual_arm_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Crucial for smoothness: This creates continuous velocity and 
    # acceleration profiles between waypoints, eliminating jerky transitions.
    interpolation_method: splines

    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

    #   left_shoulder_joint:
    #     trajectory: 0.1
    #     goal: 0.05
    #   left_elbow_joint:
    #     trajectory: 0.1
    #     goal: 0.05
    #   right_shoulder_joint:
    #     trajectory: 0.1
    #     goal: 0.05
    #   right_elbow_joint:
    #     trajectory: 0.1
    #     goal: 0.05

    # gains:
    #   left_shoulder_joint:  { p: 5.0, i: 0.0, d: 1.0 }
    #   left_elbow_joint:     { p: 5.0, i: 0.0, d: 1.0 }
    #   right_shoulder_joint: { p: 5.0, i: 0.0, d: 1.0 }
    #   right_elbow_joint:    { p: 5.0, i: 0.0, d: 1.0 }

dual_arm_position_controller:
  ros__parameters:
    joints:
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint
    interface_name: position

dual_arm_velocity_controller:
  ros__parameters:
    joints:
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint
    interface_name: velocity

dual_arm_effort_controller:
  ros__parameters:
    joints:
      - left_shoulder_joint
      - left_elbow_joint
      - right_shoulder_joint
      - right_elbow_joint
    interface_name: effort

## Left arm
fts_broadcaster:
  ros__parameters:
    sensor_name: leptrino_fts
    frame_id: tool_link

